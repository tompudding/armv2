# Formatting and linting for the emulator's python. Settings live in
# pyproject.toml. Type checking is done by the parent project, for the reason
# explained at the bottom of that file.
#
# Install with:  pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Lint first so the formatter gets the last word on anything it rewrites
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # src/libc and rijndael-alg-fst.h are vendored from elsewhere. Leave them
      # exactly as upstream has them so they stay diffable against it.
      - id: trailing-whitespace
        exclude: &vendored ^(build/|src/|resource/|rijndael-alg-fst\.h$)
      - id: end-of-file-fixer
        exclude: *vendored
      - id: mixed-line-ending
        exclude: *vendored
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
